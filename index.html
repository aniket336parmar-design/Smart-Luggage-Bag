<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Smart Bag Control</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ══════════════════════════════════
       LIGHT THEME (default)
    ══════════════════════════════════ */
    :root {
      --bg:           #f5f4f0;
      --bg-app:       #ffffff;
      --surface:      #fafaf8;
      --surface-2:    #f2f1ed;
      --surface-3:    #e8e7e2;

      --border:       rgba(0,0,0,0.08);
      --border-md:    rgba(0,0,0,0.13);
      --border-strong:rgba(0,0,0,0.2);

      --text-primary:   #1a1916;
      --text-secondary: #5c5a54;
      --text-muted:     #9c9a93;
      --text-faint:     #bbb9b2;

      --accent:       #2d6a4f;
      --accent-light: #e8f5ee;
      --accent-mid:   #52b788;

      --blue:         #2563eb;
      --blue-light:   #eff6ff;

      --amber:        #b45309;
      --amber-light:  #fffbeb;

      --red:          #c0392b;
      --red-light:    #fef2f2;

      --green:        #2d6a4f;
      --green-light:  #e8f5ee;

      --nav-bg:       rgba(255,255,255,0.95);
      --nav-bg-desktop: rgba(255,255,255,0.97);

      --desktop-body-bg: #eceae4;

      --radius-sm:  6px;
      --radius-md:  10px;
      --radius-lg:  16px;
      --radius-xl:  22px;
      --radius-pill:99px;

      --shadow-sm:  0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md:  0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
      --shadow-lg:  0 12px 40px rgba(0,0,0,0.12), 0 4px 12px rgba(0,0,0,0.06);

      --t: .2s cubic-bezier(.4,0,.2,1);

      /* Theme toggle button */
      --toggle-bg:     #e8e7e2;
      --toggle-color:  #5c5a54;
      --toggle-border: rgba(0,0,0,0.12);
    }

    /* ══════════════════════════════════
       DARK THEME
    ══════════════════════════════════ */
    body.dark-theme {
      --bg:           #0f0f12;
      --bg-app:       #121216;
      --surface:      #1a1a20;
      --surface-2:    #1f1f27;
      --surface-3:    #28282f;

      --border:       rgba(255,255,255,0.07);
      --border-md:    rgba(255,255,255,0.11);
      --border-strong:rgba(255,255,255,0.18);

      --text-primary:   #e8e6f0;
      --text-secondary: #a09eb0;
      --text-muted:     #6b6980;
      --text-faint:     #45435a;

      --accent:       #7c6cff;
      --accent-light: #1e1a3a;
      --accent-mid:   #9d90ff;

      --blue:         #6b9fff;
      --blue-light:   #131b30;

      --amber:        #d4943a;
      --amber-light:  #271e0f;

      --red:          #e05c52;
      --red-light:    #281414;

      --green:        #7c6cff;
      --green-light:  #1e1a3a;

      --nav-bg:       rgba(18,18,22,0.95);
      --nav-bg-desktop: rgba(18,18,22,0.97);

      --desktop-body-bg: #090910;

      --shadow-sm:  0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
      --shadow-md:  0 4px 12px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.2);
      --shadow-lg:  0 12px 40px rgba(0,0,0,0.5), 0 4px 12px rgba(0,0,0,0.3);

      /* Theme toggle button */
      --toggle-bg:     #28282f;
      --toggle-color:  #a09eb0;
      --toggle-border: rgba(255,255,255,0.1);
    }

    /* ── Global color transition ── */
    body,
    body * {
      transition:
        background-color 0.25s cubic-bezier(.4,0,.2,1),
        border-color     0.25s cubic-bezier(.4,0,.2,1),
        color            0.25s cubic-bezier(.4,0,.2,1),
        box-shadow       0.25s cubic-bezier(.4,0,.2,1);
    }

    html { font-size: 16px; overflow-x: hidden; -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* ── APP SHELL ── */
    .app-shell {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: var(--bg-app);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ── PAGES ── */
    .page { display: none; flex-direction: column; flex: 1; }
    .page.active { display: flex; }

    /* ── SCROLL AREA ── */
    .scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 100px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ══════════════════════════════════
       HEADER
    ══════════════════════════════════ */
    header {
      padding: 20px 18px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-app);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-brand { display: flex; align-items: center; gap: 10px; }

    .brand-icon {
      width: 34px; height: 34px;
      background: var(--accent);
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      color: #fff;
      flex-shrink: 0;
    }

    .header-left h1 {
      font-size: .95rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -.2px;
    }

    .header-left p {
      font-size: .68rem;
      color: var(--text-muted);
      font-weight: 400;
      margin-top: 1px;
    }

    /* ── HEADER RIGHT: status + toggle ── */
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: .68rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: var(--radius-pill);
      background: var(--green-light);
      color: var(--green);
      border: 1px solid rgba(45,106,79,0.2);
      transition: var(--t);
    }

    body.dark-theme .status-badge {
      border-color: rgba(124,108,255,0.25);
    }

    .status-badge.disconnected {
      background: var(--red-light);
      color: var(--red);
      border-color: rgba(192,57,43,0.2);
    }

    body.dark-theme .status-badge.disconnected {
      border-color: rgba(224,92,82,0.25);
    }

    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .status-dot.pulse { animation: pulse 2s infinite; }

    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: .4; }
    }

    /* ── THEME TOGGLE BUTTON ── */
    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--toggle-border);
      background: var(--toggle-bg);
      color: var(--toggle-color);
      cursor: pointer;
      font-size: 14px;
      flex-shrink: 0;
      line-height: 1;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .theme-toggle:active { transform: scale(.92); }

    /* ══════════════════════════════════
       SECTION LABELS
    ══════════════════════════════════ */
    .section-label {
      font-size: .63rem;
      font-weight: 600;
      letter-spacing: .9px;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0 0;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ══════════════════════════════════
       CENTRAL CARD
    ══════════════════════════════════ */
    .central-card {
      background: var(--surface);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border-md);
      padding: 28px 20px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* ── STATE RING ── */
    .state-ring-wrap {
      position: relative;
      width: 148px;
      height: 148px;
    }

    .state-ring-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .ring-bg {
      fill: none;
      stroke: var(--surface-3);
      stroke-width: 8;
    }

    .ring-fill {
      fill: none;
      stroke: var(--accent);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 408;
      stroke-dashoffset: 306;
      transition: stroke-dashoffset .7s cubic-bezier(.4,0,.2,1), stroke .4s;
    }

    .ring-fill.ring-moving { stroke: var(--blue); }
    .ring-fill.ring-lost   { stroke: var(--red); }
    .ring-fill.ring-warn   { stroke: var(--amber); }

    .state-label {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      text-align: center;
    }

    .state-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      font-size: .6rem;
      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase;
      background: var(--green-light);
      color: var(--green);
      border: 1px solid rgba(45,106,79,0.15);
      transition: var(--t);
    }

    body.dark-theme .state-pill {
      border-color: rgba(124,108,255,0.18);
    }

    .state-pill-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: currentColor;
    }

    .state-pill.warn   { background: var(--amber-light); color: var(--amber); border-color: rgba(180,83,9,.15); }
    .state-pill.danger { background: var(--red-light);   color: var(--red);   border-color: rgba(192,57,43,.15); animation: flashPill 1s infinite; }
    .state-pill.blue   { background: var(--blue-light);  color: var(--blue);  border-color: rgba(37,99,235,.15); }
    .state-pill.neutral{ background: var(--surface-2);   color: var(--text-muted); border-color: var(--border); }

    body.dark-theme .state-pill.warn   { border-color: rgba(212,148,58,.18); }
    body.dark-theme .state-pill.danger { border-color: rgba(224,92,82,.18); }
    body.dark-theme .state-pill.blue   { border-color: rgba(107,159,255,.18); }

    @keyframes flashPill { 0%,100% {opacity:1;} 50% {opacity:.5;} }

    .state-text {
      font-size: .95rem;
      font-weight: 700;
      letter-spacing: -.2px;
      color: var(--text-primary);
    }

    .state-sub {
      font-size: .62rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* ── ACTION ROW ── */
    .action-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 13px 10px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-md);
      cursor: pointer;
      font-size: .83rem;
      font-weight: 600;
      font-family: inherit;
      transition: var(--t);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      background: var(--surface-2);
      color: var(--text-secondary);
    }

    .btn:active { transform: scale(.97); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
      box-shadow: var(--shadow-sm);
    }

    .btn-primary:hover { filter: brightness(1.1); }

    .btn-primary.stop-mode {
      background: var(--red);
      border-color: transparent;
    }

    .btn-primary.stop-mode:hover { filter: brightness(1.1); }

    .btn-secondary:hover { background: var(--surface-3); color: var(--text-primary); }

    /* ══════════════════════════════════
       STATUS INDICATOR ROW
    ══════════════════════════════════ */
    .status-row {
      display: flex;
      gap: 8px;
    }

    .status-chip {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 10px 6px;
      border-radius: var(--radius-md);
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: .6rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: .3px;
      text-transform: uppercase;
    }

    .chip-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--surface-3);
      transition: background var(--t), box-shadow var(--t);
    }

    .chip-dot.on   { background: var(--accent); box-shadow: 0 0 0 3px rgba(45,106,79,.12); }
    .chip-dot.warn { background: var(--amber); }
    .chip-dot.off  { background: var(--surface-3); }

    body.dark-theme .chip-dot.on { box-shadow: 0 0 0 3px rgba(124,108,255,.15); }

    /* ══════════════════════════════════
       DATA CARDS
    ══════════════════════════════════ */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .data-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 15px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color var(--t);
    }

    .data-card:hover { border-color: var(--border-md); }
    .data-card.full  { grid-column: 1 / -1; }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-size: .63rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .7px;
    }

    .card-tag {
      font-size: .58rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: var(--radius-pill);
      letter-spacing: .3px;
      text-transform: uppercase;
    }

    .tag-green  { background: var(--green-light);  color: var(--green); }
    .tag-blue   { background: var(--blue-light);   color: var(--blue); }
    .tag-amber  { background: var(--amber-light);  color: var(--amber); }
    .tag-gray   { background: var(--surface-2);    color: var(--text-muted); }

    .card-value {
      font-size: 1.4rem;
      font-weight: 700;
      line-height: 1;
      color: var(--text-primary);
      letter-spacing: -.4px;
      font-family: 'DM Mono', monospace;
    }

    .card-value.lost-val { color: var(--red); }

    .card-sub {
      font-size: .63rem;
      color: var(--text-muted);
      font-weight: 400;
      margin-top: 2px;
    }

    /* ── SIGNAL BARS ── */
    .signal-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 22px;
    }

    .bar {
      width: 5px;
      border-radius: 2px;
      background: var(--surface-3);
      transition: background .3s;
    }

    .bar:nth-child(1) { height: 25%; }
    .bar:nth-child(2) { height: 42%; }
    .bar:nth-child(3) { height: 60%; }
    .bar:nth-child(4) { height: 80%; }
    .bar:nth-child(5) { height: 100%; }

    .bar.on         { background: var(--accent); }
    .bar.on.sig-warn{ background: var(--amber); }
    .bar.on.sig-bad { background: var(--red); }

    /* ── COMPASS ── */
    .compass-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .compass-ring {
      width: 44px; height: 44px;
      border: 1.5px solid var(--border-md);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface-2);
      flex-shrink: 0;
    }

    .compass-needle {
      width: 0; height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-bottom: 16px solid var(--accent);
      transition: transform .6s cubic-bezier(.4,0,.2,1);
    }

    /* ── GPS CARD ── */
    .gps-content {
      background: var(--surface-2);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      padding: 10px 12px;
      font-family: 'DM Mono', monospace;
      font-size: .72rem;
      color: var(--blue);
      line-height: 1.8;
      min-height: 52px;
      word-break: break-all;
    }

    /* ══════════════════════════════════
       NOTIFICATIONS
    ══════════════════════════════════ */
    .notif-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
    }

    .notif-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .notif-title {
      font-size: .63rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .7px;
    }

    .notif-clear {
      font-size: .65rem;
      color: var(--accent);
      cursor: pointer;
      font-weight: 600;
      border: none;
      background: none;
      font-family: inherit;
      opacity: .7;
      transition: opacity .2s;
    }

    .notif-clear:hover { opacity: 1; }

    .notif-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 140px;
      overflow-y: auto;
    }

    .notif-item {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-size: .74rem;
      animation: slideIn .25s ease;
      padding: 7px 8px;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .notif-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      margin-top: 4px;
      flex-shrink: 0;
    }

    .notif-dot.info    { background: var(--blue); }
    .notif-dot.warn    { background: var(--amber); }
    .notif-dot.danger  { background: var(--red); }
    .notif-dot.success { background: var(--accent); }

    .notif-msg  { flex: 1; color: var(--text-secondary); font-weight: 400; }
    .notif-time { color: var(--text-faint); font-size: .6rem; flex-shrink: 0; font-family: 'DM Mono', monospace; }

    /* ══════════════════════════════════
       BOTTOM NAV
    ══════════════════════════════════ */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      background: var(--nav-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex;
      z-index: 100;
      padding: 6px 16px calc(6px + env(safe-area-inset-bottom));
      gap: 6px;
    }

    .nav-tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 10px 0 8px;
      cursor: pointer;
      border: none;
      background: none;
      font-family: inherit;
      font-size: .63rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: var(--t);
      -webkit-tap-highlight-color: transparent;
      border-radius: var(--radius-md);
      letter-spacing: .2px;
      text-transform: uppercase;
    }

    .nav-tab.active {
      color: var(--accent);
      background: var(--green-light);
    }

    .nav-icon {
      font-size: 18px;
      line-height: 1;
    }

    /* ══════════════════════════════════
       REMOTE PAGE
    ══════════════════════════════════ */
    .remote-page { align-items: stretch; }

    .remote-header {
      padding: 20px 18px 14px;
      background: var(--bg-app);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .remote-header h1 { font-size: .95rem; font-weight: 700; }
    .remote-header p  { font-size: .68rem; color: var(--text-muted); margin-top: 1px; }

    .remote-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 100px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: stretch;
    }

    /* ── D-PAD ── */
    .dpad-wrap {
      background: var(--surface);
      border: 1px solid var(--border-md);
      border-radius: var(--radius-xl);
      padding: 24px 20px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .dpad-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .dpad-btn {
      width: 68px; height: 68px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-md);
      background: var(--bg-app);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-family: inherit;
      font-weight: 700;
      color: var(--text-secondary);
      transition: var(--t);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-shadow: var(--shadow-sm);
    }

    .dpad-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--green-light);
    }

    .dpad-btn:active,
    .dpad-btn.pressed {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      transform: scale(.93);
      box-shadow: none;
    }

    .dpad-btn.stop-btn {
      background: var(--red-light);
      border: 1px solid rgba(192,57,43,.2);
      color: var(--red);
      width: 68px; height: 68px;
      border-radius: 50%;
      font-size: .65rem;
      font-weight: 800;
      letter-spacing: .8px;
      box-shadow: none;
    }

    body.dark-theme .dpad-btn.stop-btn {
      border-color: rgba(224,92,82,.2);
    }

    .dpad-btn.stop-btn:hover {
      background: var(--red-light);
      border-color: var(--red);
      filter: brightness(1.1);
    }

    .dpad-btn.stop-btn:active,
    .dpad-btn.stop-btn.pressed {
      background: var(--red);
      color: #fff;
      transform: scale(.93);
    }

    /* ── SPEED CARD ── */
    .speed-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
    }

    .speed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .speed-title {
      font-size: .63rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .7px;
    }

    .speed-val {
      font-size: .85rem;
      font-weight: 700;
      color: var(--accent);
      font-family: 'DM Mono', monospace;
    }

    .speed-slider {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 5px;
      border-radius: 3px;
      background: var(--surface-3);
      outline: none;
      cursor: pointer;
    }

    .speed-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg-app);
      box-shadow: var(--shadow-md);
      cursor: pointer;
    }

    /* ── LAST COMMAND ── */
    .cmd-display {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cmd-label {
      font-size: .6rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .7px;
    }

    .cmd-value {
      font-size: .95rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .cmd-arrow { margin-left: auto; font-size: 1.2rem; }

    /* ══════════════════════════════════
       SCROLLBAR
    ══════════════════════════════════ */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 2px; }

    /* ══════════════════════════════════
       DESKTOP LAYOUT (≥768px)
    ══════════════════════════════════ */
    @media (min-width: 768px) {
      body {
        background: var(--desktop-body-bg);
        padding: 40px 20px 60px;
        align-items: flex-start;
        justify-content: center;
      }

      .app-shell {
        max-width: 440px;
        min-height: auto;
        border-radius: var(--radius-xl);
        border: 1px solid var(--border-md);
        box-shadow: var(--shadow-lg);
        overflow: hidden;
      }

      .scroll-area { padding: 16px 18px 100px; }
      .remote-scroll { padding: 16px 18px 100px; }

      .bottom-nav {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        max-width: 100%;
        transform: none;
        border-top: 1px solid var(--border);
        border-radius: 0 0 var(--radius-xl) var(--radius-xl);
        padding: 6px 16px 14px;
        background: var(--nav-bg-desktop);
      }

      .dpad-btn { width: 72px; height: 72px; }
      .dpad-btn.stop-btn { width: 72px; height: 72px; }
    }
  </style>
</head>
<body>
<div class="app-shell">

  <!-- ═════════════════════════════
       PAGE 1 — DASHBOARD
  ═════════════════════════════ -->
  <div class="page active" id="page-dashboard">

    <header>
      <div class="header-brand">
        <div class="brand-icon">🎒</div>
        <div class="header-left">
          <h1>Smart Bag</h1>
          <p>Traveler Pro X1</p>
        </div>
      </div>
      <div class="header-right">
        <div class="status-badge" id="status-badge">
          <span class="status-dot pulse"></span>
          <span id="status-text">Connected</span>
        </div>
        <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle dark/light theme">🌙</button>
      </div>
    </header>

    <div class="scroll-area">

      <!-- CENTRAL STATE CARD -->
      <div class="central-card">
        <div class="state-ring-wrap">
          <svg class="state-ring-svg" viewBox="0 0 148 148" xmlns="http://www.w3.org/2000/svg">
            <circle class="ring-bg"   cx="74" cy="74" r="65" />
            <circle class="ring-fill" cx="74" cy="74" r="65" id="ring-fill" />
          </svg>
          <div class="state-label">
            <div class="state-pill neutral" id="state-pill">
              <div class="state-pill-dot"></div>
              <span id="pill-text">Standby</span>
            </div>
            <span class="state-text" id="state-text">OFFLINE</span>
            <span class="state-sub"  id="state-sub">System inactive</span>
          </div>
        </div>

        <div class="action-row">
          <button class="btn btn-primary" id="btn-toggle" onclick="toggle()">
            <span id="btn-toggle-label">Start Follow</span>
          </button>
          <button class="btn btn-secondary" onclick="triggerFindMe()">
            📡 Find Me
          </button>
        </div>
      </div>

      <!-- STATUS ROW -->
      <div class="status-row">
        <div class="status-chip">
          <div class="chip-dot" id="dot-follow"></div>
          Follow
        </div>
        <div class="status-chip">
          <div class="chip-dot" id="dot-ready"></div>
          Ready
        </div>
        <div class="status-chip">
          <div class="chip-dot" id="dot-moving"></div>
          Moving
        </div>
        <div class="status-chip">
          <div class="chip-dot" id="dot-gps"></div>
          GPS
        </div>
      </div>

      <!-- SENSOR DATA -->
      <span class="section-label">Live Sensors</span>

      <div class="cards-grid">

        <div class="data-card">
          <div class="card-header">
            <span class="card-title">Signal</span>
            <span class="card-tag tag-gray">RSSI</span>
          </div>
          <div class="signal-bars" id="signal-bars">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
          </div>
          <div class="card-value" id="rssi-value">--</div>
          <div class="card-sub">dBm strength</div>
        </div>

        <div class="data-card">
          <div class="card-header">
            <span class="card-title">Heading</span>
            <span class="card-tag tag-gray">IMU</span>
          </div>
          <div class="compass-wrap">
            <div class="compass-ring">
              <div class="compass-needle" id="compass-needle"></div>
            </div>
            <div>
              <div class="card-value" id="compass-deg">0°</div>
              <div class="card-sub" id="compass-dir">Waiting…</div>
            </div>
          </div>
        </div>

        <div class="data-card full">
          <div class="card-header">
            <span class="card-title">GPS Location</span>
            <span class="card-tag tag-amber" id="gps-status-badge">Searching</span>
          </div>
          <div class="gps-content" id="gps-val">Waiting for fix…</div>
        </div>

      </div>

      <!-- NOTIFICATIONS -->
      <span class="section-label">System Log</span>

      <div class="notif-card">
        <div class="notif-header">
          <span class="notif-title">Event Feed</span>
          <button class="notif-clear" onclick="clearNotifications()">Clear all</button>
        </div>
        <div class="notif-list" id="notif-list"></div>
      </div>

    </div>
  </div><!-- /dashboard -->


  <!-- ═════════════════════════════
       PAGE 2 — REMOTE CONTROL
  ═════════════════════════════ -->
  <div class="page remote-page" id="page-remote">

    <div class="remote-header">
      <h1>Remote Control</h1>
      <p>Manual drive mode</p>
    </div>

    <div class="remote-scroll">

      <div class="dpad-wrap">
        <div class="dpad-row">
          <button class="dpad-btn" id="btn-fwd"
                  onpointerdown="pressDir('FORWARD','btn-fwd')"
                  onpointerup="releaseDir('btn-fwd')"
                  onpointerleave="releaseDir('btn-fwd')">▲</button>
        </div>
        <div class="dpad-row">
          <button class="dpad-btn" id="btn-left"
                  onpointerdown="pressDir('LEFT','btn-left')"
                  onpointerup="releaseDir('btn-left')"
                  onpointerleave="releaseDir('btn-left')">◀</button>

          <button class="dpad-btn stop-btn" id="btn-stop"
                  onpointerdown="pressDir('STOP','btn-stop')"
                  onpointerup="releaseDir('btn-stop')"
                  onpointerleave="releaseDir('btn-stop')">STOP</button>

          <button class="dpad-btn" id="btn-right"
                  onpointerdown="pressDir('RIGHT','btn-right')"
                  onpointerup="releaseDir('btn-right')"
                  onpointerleave="releaseDir('btn-right')">▶</button>
        </div>
        <div class="dpad-row">
          <button class="dpad-btn" id="btn-back"
                  onpointerdown="pressDir('BACKWARD','btn-back')"
                  onpointerup="releaseDir('btn-back')"
                  onpointerleave="releaseDir('btn-back')">▼</button>
        </div>
      </div>

      <div class="speed-card">
        <div class="speed-header">
          <span class="speed-title">Drive Speed</span>
          <span class="speed-val" id="speed-display">50%</span>
        </div>
        <input type="range" class="speed-slider" id="speed-slider"
               min="0" max="100" value="50" step="1"
               oninput="updateSpeed(this.value)" />
      </div>

      <div class="cmd-display">
        <div>
          <div class="cmd-label">Last Command</div>
          <div class="cmd-value" id="cmd-value">Idle</div>
        </div>
        <span class="cmd-arrow" id="cmd-arrow">⏸</span>
      </div>

    </div>
  </div><!-- /remote -->


  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-tab active" id="tab-dashboard" onclick="switchPage('dashboard')">
      <span class="nav-icon">📊</span>
      Dashboard
    </button>
    <button class="nav-tab" id="tab-remote" onclick="switchPage('remote')">
      <span class="nav-icon">🕹️</span>
      Remote
    </button>
  </nav>

</div><!-- /app-shell -->

<script>
  const uiState = {
    speed: 50,
    lastCmd: 'Idle',
    lastSentHeading: 0,
    smoothedHeading: 0,
    compStarted: false,
  };

  /* ── NAVIGATION ── */
  function switchPage(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    document.getElementById('tab-' + name).classList.add('active');
  }

  /* ── TOGGLE ── */
  function toggle() {
    fetch('/toggle');
    if (!uiState.compStarted) {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission();
      }
      window.addEventListener('deviceorientation', (e) => {
        let h = e.webkitCompassHeading || e.alpha;
        if (h != null) {
          let diff = h - uiState.smoothedHeading;
          if (diff > 180) diff -= 360;
          if (diff < -180) diff += 360;
          uiState.smoothedHeading = (uiState.smoothedHeading + diff * 0.3 + 360) % 360;
        }
      });
      setInterval(() => {
        let d = Math.round(uiState.smoothedHeading - uiState.lastSentHeading);
        if (d > 180) d -= 360;
        if (d < -180) d += 360;
        fetch('/comp?d=' + d);
        uiState.lastSentHeading = uiState.smoothedHeading;
      }, 1000);
      uiState.compStarted = true;
    }
  }

  function triggerFindMe() {
    addNotification('Find Me alert sent — buzzer activated', 'warn');
  }

  /* ── POLLING ── */
  function update() {
    fetch('/get_data')
      .then(r => r.json())
      .then(d => {
        updateRSSI(d.rssi);
        updateCompass(d.raw_d);
        updateGPS(d.gps);
        updateSystemState(d.follow, d.ready, d.moving);
        updateStatusDots(d.follow, d.ready, d.moving, d.gps);
        document.getElementById('status-badge').classList.remove('disconnected');
        document.getElementById('status-text').textContent = 'Connected';
      })
      .catch(() => {
        document.getElementById('status-badge').classList.add('disconnected');
        document.getElementById('status-text').textContent = 'Offline';
      });
  }

  setInterval(update, 200);

  /* ── RSSI ── */
  function updateRSSI(rssi) {
    const el = document.getElementById('rssi-value');
    if (rssi <= -110) {
      el.textContent = 'LOST';
      el.classList.add('lost-val');
      updateSignalBars(0);
      return;
    }
    el.textContent = rssi + ' dBm';
    el.classList.remove('lost-val');
    let bars;
    if      (rssi >= -55) bars = 5;
    else if (rssi >= -65) bars = 4;
    else if (rssi >= -75) bars = 3;
    else if (rssi >= -85) bars = 2;
    else                  bars = 1;
    updateSignalBars(bars, rssi);
  }

  function updateSignalBars(level, rssi) {
    document.querySelectorAll('.bar').forEach((bar, i) => {
      bar.classList.remove('on', 'sig-warn', 'sig-bad');
      if (i < level) {
        bar.classList.add('on');
        if (rssi !== undefined) {
          if      (rssi < -85) bar.classList.add('sig-bad');
          else if (rssi < -75) bar.classList.add('sig-warn');
        }
      }
    });
  }

  /* ── COMPASS ── */
  const dirLabels = [
    { max: 22.5,  label: 'North' },
    { max: 67.5,  label: 'NE' },
    { max: 112.5, label: 'East' },
    { max: 157.5, label: 'SE' },
    { max: 202.5, label: 'South' },
    { max: 247.5, label: 'SW' },
    { max: 292.5, label: 'West' },
    { max: 337.5, label: 'NW' },
    { max: 360,   label: 'North' },
  ];

  function updateCompass(deg) {
    deg = ((deg % 360) + 360) % 360;
    document.getElementById('compass-deg').textContent = deg + '°';
    document.getElementById('compass-needle').style.transform = 'rotate(' + deg + 'deg)';
    const dir = dirLabels.find(d => deg <= d.max) || dirLabels[dirLabels.length - 1];
    document.getElementById('compass-dir').textContent = dir.label;
  }

  /* ── GPS ── */
  function updateGPS(gpsStr) {
    document.getElementById('gps-val').innerHTML = gpsStr || 'Waiting for fix…';
    const hasFix = gpsStr && !gpsStr.includes('Waiting');
    const badge = document.getElementById('gps-status-badge');
    badge.textContent = hasFix ? 'Fixed' : 'Searching';
    badge.className = 'card-tag ' + (hasFix ? 'tag-green' : 'tag-amber');
  }

  /* ── SYSTEM STATE ── */
  let prevFollow = false;

  function updateSystemState(follow, ready, moving) {
    const btn   = document.getElementById('btn-toggle');
    const label = document.getElementById('btn-toggle-label');
    const pill  = document.getElementById('state-pill');
    const pillTxt = document.getElementById('pill-text');
    const ring  = document.getElementById('ring-fill');
    const stTxt = document.getElementById('state-text');
    const stSub = document.getElementById('state-sub');

    btn.classList.toggle('stop-mode', !!follow);
    label.textContent = follow ? 'Stop System' : 'Start Follow';

    if (follow !== prevFollow) {
      addNotification(follow ? 'System started — tracking active' : 'System stopped', follow ? 'info' : 'success');
      prevFollow = follow;
    }

    ring.className = 'ring-fill';
    pill.className = 'state-pill';

    const C = 2 * Math.PI * 65;

    if (!follow) {
      stTxt.textContent = 'OFFLINE';
      stSub.textContent  = 'System inactive';
      ring.style.strokeDashoffset = C * 0.75;
      pill.classList.add('neutral');
      pillTxt.textContent = 'Standby';
    } else if (!ready) {
      stTxt.textContent = 'WARMING UP';
      stSub.textContent  = 'Stabilising sensors';
      ring.style.strokeDashoffset = C * 0.5;
      pill.classList.add('warn');
      pillTxt.textContent = 'Stabilising';
    } else if (moving) {
      stTxt.textContent = 'MOVING';
      stSub.textContent  = 'Tracking active';
      ring.classList.add('ring-moving');
      ring.style.strokeDashoffset = C * 0.08;
      pill.classList.add('blue');
      pillTxt.textContent = 'Tracking';
    } else {
      const rssiEl = document.getElementById('rssi-value');
      if (rssiEl.classList.contains('lost-val')) {
        stTxt.textContent = 'SIGNAL LOST';
        stSub.textContent  = 'Out of range';
        ring.classList.add('ring-lost');
        ring.style.strokeDashoffset = C * 0.85;
        pill.classList.add('danger');
        pillTxt.textContent = 'Lost';
      } else {
        stTxt.textContent = 'WAITING';
        stSub.textContent  = 'In range — idle';
        ring.style.strokeDashoffset = C * 0.35;
        pill.classList.add('neutral');
        pillTxt.textContent = 'Idle';
      }
    }
  }

  /* ── STATUS DOTS ── */
  function updateStatusDots(follow, ready, moving, gps) {
    const set = (id, s) => {
      const el = document.getElementById(id);
      el.classList.remove('on', 'warn', 'off');
      if (s) el.classList.add(s);
    };
    set('dot-follow', follow ? 'on' : 'off');
    set('dot-ready',  ready  ? 'on' : (follow ? 'warn' : 'off'));
    set('dot-moving', moving ? 'on' : 'off');
    const hasFix = gps && !gps.includes('Waiting');
    set('dot-gps', hasFix ? 'on' : 'warn');
  }

  /* ── D-PAD ── */
  const cmdArrows = { FORWARD:'⬆️', BACKWARD:'⬇️', LEFT:'⬅️', RIGHT:'➡️', STOP:'⏹' };

  function pressDir(cmd, btnId) {
    document.getElementById(btnId).classList.add('pressed');
    document.getElementById('cmd-value').textContent = cmd;
    document.getElementById('cmd-arrow').textContent = cmdArrows[cmd] || '⏸';
  }

  function releaseDir(btnId) {
    document.getElementById(btnId).classList.remove('pressed');
  }

  /* ── SPEED ── */
  function updateSpeed(val) {
    uiState.speed = val;
    document.getElementById('speed-display').textContent = val + '%';
  }

  /* ── NOTIFICATIONS ── */
  function addNotification(msg, type) {
    type = type || 'info';
    const list = document.getElementById('notif-list');
    const now  = new Date();
    const time = now.getHours().toString().padStart(2,'0') + ':'
               + now.getMinutes().toString().padStart(2,'0') + ':'
               + now.getSeconds().toString().padStart(2,'0');
    const item = document.createElement('div');
    item.className = 'notif-item';
    item.innerHTML =
      '<span class="notif-dot ' + type + '"></span>' +
      '<span class="notif-msg">' + msg + '</span>' +
      '<span class="notif-time">' + time + '</span>';
    list.insertBefore(item, list.firstChild);
    while (list.children.length > 8) list.removeChild(list.lastChild);
  }

  function clearNotifications() {
    document.getElementById('notif-list').innerHTML = '';
  }

  /* ── THEME TOGGLE ── */
  const toggleBtn = document.getElementById('theme-toggle');

  function applyTheme(dark) {
    if (dark) {
      document.body.classList.add('dark-theme');
      toggleBtn.textContent = '☀️';
    } else {
      document.body.classList.remove('dark-theme');
      toggleBtn.textContent = '🌙';
    }
  }

  function toggleTheme() {
    const isDark = document.body.classList.contains('dark-theme');
    applyTheme(!isDark);
    try { localStorage.setItem('theme', !isDark ? 'dark' : 'light'); } catch(e) {}
  }

  /* Restore saved theme on load */
  (function() {
    try {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark') applyTheme(true);
    } catch(e) {}
  })();

  addNotification('Dashboard loaded — connecting…', 'info');
  update();
</script>
</body>
</html>
